[project]
name = "mini-zac"
version = "0.1.0"
description = "A research-oriented zoned neutral-atom quantum compiler inspired by ZAC."
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
    "qiskit==2.5.2",
    "rustworkx>=0.15,<1",
]


[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff",
    "mypy",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/minizac"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
]


[tool.ruff]
target-version = "py312"
line-length = 100


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]


[tool.mypy]
python_version = "3.12"

warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true

disallow_untyped_defs = true
check_untyped_defs = true

no_implicit_optional = true